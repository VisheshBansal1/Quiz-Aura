<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizAura – Tournament</title>
  <meta name="description" content="Join the tournament on QuizAura!" />

  <!-- Open Graph -->
  <meta property="og:site_name" content="QuizAura" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://quizaura.netlify.app/og-banner.png" />

  <!-- Firebase JS SDK -->
  <script type="module">
    import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs, Timestamp }
                               from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
      apiKey:            "AIzaSyAXRZpN-am5AGlAMcfH6JJ9QuWK1LI8WJ8",
      authDomain:        "quiz-sphere-3ec4d.firebaseapp.com",
      projectId:         "quiz-sphere-3ec4d",
      storageBucket:     "quiz-sphere-3ec4d.firebasestorage.app",
      messagingSenderId: "296193820246",
      appId:             "1:296193820246:web:b66abb73f51b1b9f6b1df7",
    });
    const db = getFirestore(app);

    // /tournament/{tournamentId}
    const pathParts   = location.pathname.split("/").filter(Boolean);
    const tournamentId = pathParts[1] ?? "";
    window.TOURNAMENT_ID = tournamentId;

    if (!tournamentId) {
      showError("Invalid link — no tournament ID found.");
    } else {
      loadTournament(tournamentId);
    }

    async function loadTournament(id) {
      try {
        const snap = await getDoc(doc(db, "tournaments", id));
        if (!snap.exists()) {
          showError("This tournament doesn't exist or has been removed.");
          return;
        }

        const d = snap.data();
        const status       = d.status ?? "upcoming";
        const endAt        = d.endAt  ? (d.endAt  instanceof Timestamp ? d.endAt.toDate()  : new Date(d.endAt))  : null;
        const startAt      = d.startAt? (d.startAt instanceof Timestamp ? d.startAt.toDate(): new Date(d.startAt)): null;
        const isEnded      = status === "finished" || status === "cancelled" ||
                             (endAt && new Date() > endAt);
        const participants = d.participantCount ?? 0;
        const maxP         = d.maxParticipants  ?? 0;
        const rounds       = d.totalRounds      ?? 0;
        const entryCoins   = d.entryCoins       ?? 0;
        const prize        = d.prizeDescription ?? "";
        const winner       = d.winnerUid ? await fetchWinnerName(d.winnerUid) : null;

        // Top-3 leaderboard (optional — only if leaderboard subcollection exists)
        const top3 = await fetchTop3(id);

        setMeta("og:title",       `🏆 ${d.title ?? "Tournament"}`);
        setMeta("og:description", `${participants}/${maxP} players · ${rounds} rounds · ${isEnded ? "Ended" : statusLabel(status)}`);
        document.title = `${d.title ?? "Tournament"} – QuizAura`;

        renderTournament({
          title: d.title ?? "Tournament",
          description: d.description ?? "",
          status, isEnded, startAt, endAt,
          participants, maxP, rounds,
          entryCoins, prize, winner, top3,
        });
      } catch (e) {
        showError("Failed to load tournament: " + e.message);
      }
    }

    async function fetchWinnerName(uid) {
      try {
        const s = await getDoc(doc(db, "users", uid));
        return s.data()?.name ?? "Champion";
      } catch { return "Champion"; }
    }

    async function fetchTop3(tId) {
      try {
        const q = query(
          collection(db, "tournaments", tId, "leaderboard"),
          orderBy("score", "desc"),
          limit(3)
        );
        const snap = await getDocs(q);
        return snap.docs.map(d => ({ name: d.data().name ?? "Player", score: d.data().score ?? 0 }));
      } catch { return []; }
    }

    function statusLabel(s) {
      return { upcoming: "Upcoming", active: "Live", finished: "Finished", cancelled: "Cancelled" }[s] ?? s;
    }

    function statusBadgeHtml(isEnded, status) {
      if (status === "cancelled") return `<span class="badge cancelled">🚫 Cancelled</span>`;
      if (isEnded || status === "finished") return `<span class="badge ended">🏁 Finished</span>`;
      if (status === "active")   return `<span class="badge live">🔴 Live Now</span>`;
      return `<span class="badge upcoming">⏳ Upcoming</span>`;
    }

    function renderTournament({ title, description, status, isEnded, startAt, endAt,
                                 participants, maxP, rounds, entryCoins, prize, winner, top3 }) {
      const card = document.getElementById("card");
      const fillPct = maxP > 0 ? Math.round(participants / maxP * 100) : 0;

      const top3Html = top3.length > 0 ? `
        <div class="section-title">🏅 Leaderboard</div>
        <div class="top3">
          ${top3.map((p, i) => `
            <div class="top3-item">
              <span class="rank-emoji">${["🥇","🥈","🥉"][i]}</span>
              <span class="rank-name">${esc(p.name)}</span>
              <span class="rank-score">${p.score} pts</span>
            </div>`).join("")}
        </div>` : "";

      const winnerHtml = winner
        ? `<div class="winner-box">🏆 Winner: <strong>${esc(winner)}</strong></div>` : "";

      card.innerHTML = `
        <div class="icon">🏆</div>
        <h1>${esc(title)}</h1>
        ${statusBadgeHtml(isEnded, status)}
        ${description ? `<p class="desc">${esc(description)}</p>` : ""}

        <div class="meta-grid">
          <div class="meta-item">
            <span class="meta-icon">👥</span>
            <span>${participants}${maxP ? "/" + maxP : ""} Players</span>
          </div>
          <div class="meta-item">
            <span class="meta-icon">🔄</span>
            <span>${rounds} Round${rounds !== 1 ? "s" : ""}</span>
          </div>
          <div class="meta-item">
            <span class="meta-icon">🗓</span>
            <span>${startAt ? fmtDate(startAt) : "TBD"}</span>
          </div>
          <div class="meta-item">
            <span class="meta-icon">🔒</span>
            <span>${endAt ? fmtDate(endAt) : "TBD"}</span>
          </div>
          ${entryCoins > 0 ? `
          <div class="meta-item">
            <span class="meta-icon">🪙</span>
            <span>${entryCoins} coins entry</span>
          </div>` : ""}
          ${prize ? `
          <div class="meta-item" style="grid-column:1/-1">
            <span class="meta-icon">🎁</span>
            <span>${esc(prize)}</span>
          </div>` : ""}
        </div>

        ${maxP > 0 ? `
        <div class="fill-bar-wrap">
          <div class="fill-bar-label">
            <span>Players filled</span><span>${fillPct}%</span>
          </div>
          <div class="fill-bar-track">
            <div class="fill-bar-fill" style="width:${fillPct}%"></div>
          </div>
        </div>` : ""}

        ${winnerHtml}
        ${top3Html}

        ${isEnded
          ? `<div class="ended-box">This tournament has ended.</div>`
          : `<button class="btn-primary" onclick="openInApp()">🚀 Open in QuizAura App</button>
             <p class="hint">Don't have the app? <a href="https://play.google.com/store/apps/details?id=com.example.quiz_app" target="_blank">Download on Play Store</a></p>`
        }
      `;

      document.getElementById("loading").style.display = "none";
      card.style.display = "flex";
    }

    window.openInApp = function () {
      const tId    = window.TOURNAMENT_ID;
      const webUrl = `https://quizaura.netlify.app/tournament/${tId}`;
      const androidPackage = "com.example.quiz_app";  // ← REPLACE with your package
      const intentUrl = `intent://quizaura.netlify.app/tournament/${tId}#Intent;`
        + `scheme=https;`
        + `package=${androidPackage};`
        + `S.browser_fallback_url=${encodeURIComponent("https://play.google.com/store/apps/details?id=" + androidPackage)};`
        + `end`;

      const isAndroid = /android/i.test(navigator.userAgent);
      const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);

      if (isAndroid)      window.location.href = intentUrl;
      else if (isIOS)     window.location.href = webUrl;
      else alert("Open this link on your phone to launch QuizAura:\n\n" + webUrl);
    };

    function showError(msg) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display   = "flex";
      document.getElementById("error-msg").textContent = msg;
    }

    function fmtDate(d) {
      return d.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    }
    function esc(s) { return String(s).replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function setMeta(prop, content) {
      let el = document.querySelector(`meta[property="${prop}"]`);
      if (el) el.setAttribute("content", content);
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      padding: 16px;
    }

    .container { width: 100%; max-width: 440px; }

    .logo { text-align: center; margin-bottom: 24px; }
    .logo-text {
      font-size: 22px; font-weight: 800; letter-spacing: 1px;
      color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .logo-text span { color: #ffd700; }

    #loading {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      color: rgba(255,255,255,.6); font-size: 14px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #card {
      display: none; flex-direction: column; align-items: center;
      gap: 14px; text-align: center;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 24px; padding: 32px 24px;
      backdrop-filter: blur(12px);
    }

    .icon { font-size: 56px; line-height: 1; }
    h1 { color: #fff; font-size: 22px; font-weight: 700; line-height: 1.3; }
    .desc { color: rgba(255,255,255,.6); font-size: 13px; line-height: 1.5; max-width: 340px; }

    .badge {
      font-size: 13px; font-weight: 700; padding: 6px 14px;
      border-radius: 99px; display: inline-flex; align-items: center; gap: 6px;
    }
    .badge.live      { background:rgba(255,82,82,.15);   color:#ff5252; border:1px solid rgba(255,82,82,.4); }
    .badge.ended,
    .badge.cancelled { background:rgba(158,158,158,.15); color:#9e9e9e; border:1px solid rgba(158,158,158,.4); }
    .badge.upcoming  { background:rgba(255,193,7,.15);   color:#ffc107; border:1px solid rgba(255,193,7,.4); }

    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; width: 100%;
    }
    .meta-item {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px; padding: 10px 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: rgba(255,255,255,.8); text-align: left;
    }
    .meta-icon { font-size: 16px; flex-shrink: 0; }

    /* Fill bar */
    .fill-bar-wrap { width: 100%; }
    .fill-bar-label {
      display: flex; justify-content: space-between;
      font-size: 12px; color: rgba(255,255,255,.5); margin-bottom: 6px;
    }
    .fill-bar-track {
      height: 8px; background: rgba(255,255,255,.1);
      border-radius: 99px; overflow: hidden;
    }
    .fill-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ff9800);
      border-radius: 99px;
      transition: width .5s ease;
    }

    /* Winner */
    .winner-box {
      background: rgba(255,215,0,.12); border: 1px solid rgba(255,215,0,.35);
      border-radius: 12px; padding: 12px 18px;
      color: #ffd700; font-size: 15px; width: 100%;
    }

    /* Top 3 */
    .section-title {
      font-size: 13px; font-weight: 700; color: rgba(255,255,255,.5);
      text-transform: uppercase; letter-spacing: .8px; align-self: flex-start;
    }
    .top3 { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .top3-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px; padding: 10px 14px;
    }
    .rank-emoji { font-size: 20px; }
    .rank-name  { flex: 1; color: #fff; font-size: 14px; font-weight: 600; text-align: left; }
    .rank-score { color: #ffd700; font-size: 13px; font-weight: 700; }

    .ended-box {
      background: rgba(158,158,158,.1); border: 1px solid rgba(158,158,158,.3);
      border-radius: 12px; padding: 14px 18px;
      color: rgba(255,255,255,.5); font-size: 14px;
    }

    .btn-primary {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #ffd700, #ff9800);
      color: #000; font-size: 16px; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 20px rgba(255,193,7,.35);
    }
    .btn-primary:hover  { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255,193,7,.45); }
    .btn-primary:active { transform: translateY(0); }

    .hint { font-size: 12px; color: rgba(255,255,255,.4); }
    .hint a { color: #ffd700; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    #error {
      display: none; flex-direction: column; align-items: center; gap: 16px;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px; padding: 32px 24px; text-align: center;
    }
    #error .err-icon { font-size: 48px; }
    #error-msg { color: rgba(255,255,255,.7); font-size: 14px; line-height: 1.5; }

    .footer { text-align: center; margin-top: 20px; font-size: 11px; color: rgba(255,255,255,.25); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-text">🧠 Quiz<span>Aura</span></div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <span>Loading tournament…</span>
    </div>

    <div id="card"></div>

    <div id="error">
      <div class="err-icon">😕</div>
      <p id="error-msg">Something went wrong.</p>
    </div>

    <div class="footer">QuizAura · Learn. Compete. Win.</div>
  </div>
</body>
</html>
