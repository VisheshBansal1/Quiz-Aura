flutter_launcher_icons:
  image_path: "assets/logo/logo.png"

  android:
    generate: true
    min_sdk_android: 21
    adaptive_icon_background: "#0F172A"
    adaptive_icon_foreground: "assets/logo/logo.png"

  ios:
    generate: true
    image_path_ios: "assets/logo/logo.png"
    remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/logo/logo.png"
    background_color: "#0F172A"
    theme_color: "#0F172A"

  windows:
    generate: true
    image_path: "assets/logo/logo.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/logo/logo.png"
