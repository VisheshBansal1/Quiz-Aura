name: QuizSphere
description: "A new Flutter project."
publish_to: 'none'

# CHANGED: build number bumped from +2 to +18. Play Console already has
# version code 17 (1.0.1), so every new upload must be higher than that.
# If Play still says "version code already used", increase it again.
version: 2.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.0.4

  # Google Sign In
  google_sign_in: ^6.3.0

  # State + UI helpers
  provider: ^6.1.2

  http: ^1.2.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  video_player: ^2.11.1
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1
  firebase_messaging: ^16.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  wakelock_plus: ^1.6.0

  shared_preferences: ^2.5.5

  app_links: ^6.3.2
  change_app_package_name: ^1.5.0
  url_launcher: ^6.3.2

  # AdMob - Families-certified (bundles play-services-ads 24.x, well above
  # the required 19.0.0). Keep it on the latest 7.x.
  google_mobile_ads: ^7.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
      - .env
      - assets/logo/
      - assets/videos/

flutter_native_splash:
  android_12:
    color: "#0c0126"
  android: true
  ios: true
  web: true

  background_image : "assets/logo/image.png"
  image: "assets/logo/app_logo5.png"
  branding: "assets/logo/image.png"